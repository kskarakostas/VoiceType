<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>VoiceType</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#4f46e5" stroke="none"/><g transform="translate(2.4 0)"><rect x="17" y="12" width="15" height="26" rx="7.5" fill="#fff" stroke="none"/><path d="M11 30a13.5 13.5 0 0 0 27 0M24.5 44v7" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M48 14v36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></svg>
      </span>
      <h1>VoiceType</h1>
    </div>
    <div id="status">
      <p class="status" id="status-ready" data-ready="true" hidden><span class="status-dot" aria-hidden="true"></span>Ready</p>
      <button type="button" class="btn btn-primary" id="add-key" hidden>Add API key</button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
    <p id="banner-text"></p>
  </div>

  <main>
    <div class="row pair">
      <div class="field">
        <label class="field-label" for="provider">Provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="active-mode">Mode</label>
        <select id="active-mode"></select>
      </div>
    </div>

    <section class="row" id="site-block" aria-labelledby="h-site">
      <h2 class="visually-hidden" id="h-site">This site</h2>
      <p class="hint" id="site-unavailable" hidden>Not available on this page</p>
      <div class="site-line" id="site-controls" hidden>
        <p id="site-host"></p>
        <label class="check"><input type="checkbox" id="site-hide">Hide pill</label>
        <label class="visually-hidden" for="site-mode">Mode on this site</label>
        <select id="site-mode"></select>
      </div>
    </section>

    <section class="row" aria-labelledby="h-today">
      <h2 class="caption" id="h-today">Today</h2>
      <dl class="today">
        <div><dt>Sessions</dt><dd id="today-sessions">0</dd></div>
        <div><dt>Words</dt><dd id="today-words">0</dd></div>
        <div><dt>Spoken</dt><dd id="today-spoken">0:00</dd></div>
        <div><dt>Cost</dt><dd id="today-cost">$0.00</dd></div>
      </dl>
    </section>

    <div class="row actions">
      <div class="split" id="copy-row">
        <button type="button" class="btn" id="copy-last" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy last</button>
      </div>
      <button type="button" class="btn btn-block" id="open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="m4.93 4.93 2.12 2.12"/><path d="m16.95 16.95 2.12 2.12"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.93 19.07 2.12-2.12"/><path d="m16.95 7.05 2.12-2.12"/></svg>Open settings</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="popup.js"></script>
</body>
</html>
