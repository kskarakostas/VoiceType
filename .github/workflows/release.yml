name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint:ext
      - name: Check the tag equals the manifest version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - run: npm run package
      - name: Take the release notes from the CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" voicetype-*.zip --verify-tag --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
